name: Update Stars for Starsky
on:
  schedule:
    - cron: '0 */6 * * *'  # каждые 6 часов
  workflow_dispatch:        # можно запустить вручную из GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch star count
        run: |
          STARS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Levonze/levonze.github.io" \
            | jq -r '.stargazers_count // "1"')
          echo "STARS=$STARS" >> $GITHUB_ENV

      - name: Save stars.json in /starsky
        run: |
          mkdir -p starsky
          echo "{\"stars\": ${{ env.STARS }}}" > starsky/stars.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starsky/stars.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(starsky): update star count to ${{ env.STARS }}"
            git push
          fi