<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Звёздное небо • Levonze</title>
  <style>
    body {
      margin: 0; background: #000; overflow: hidden; height: 100vh; position: relative; color: white; font-family: sans-serif;
    }
    #info {
      position: absolute; top: 20px; width: 100%; text-align: center; font-size: 16px; opacity: 0.8;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }
    .star {
      position: absolute; background: white; border-radius: 50%;
      animation: twinkle var(--duration, 3s) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="info">Загрузка звёздного неба...</div>
  <div id="stars-container"></div>

  <script>
    async function loadStars() {
      try {
        // Добавляем кэш-бастер, чтобы не получить старый кэш при обновлении
        const res = await fetch("stars.json?" + Date.now());
        if (!res.ok) throw new Error("stars.json not found");
        const data = await res.json();
        return Math.max(data.stars || 1, 1);
      } catch (e) {
        console.warn("Ошибка загрузки stars.json:", e);
        return 1; // fallback
      }
    }

    function createStars(count) {
      const container = document.getElementById("stars-container");
      const info = document.getElementById("info");
      info.textContent = `Звёзд на небе: ${count} ⭐`;

      container.innerHTML = "";
      const max = Math.min(count, 2000); // ограничение для производительности
      for (let i = 0; i < max; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = `${Math.random() * 100}vw`;
        star.style.top = `${Math.random() * 100}vh`;
        star.style.width = star.style.height = `${Math.random() * 2 + 0.5}px`;
        star.style.setProperty("--duration", `${Math.random() * 4 + 2}s`);
        container.appendChild(star);
      }
    }

    loadStars().then(createStars);
  </script>
</body>
</html>
