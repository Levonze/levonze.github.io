<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Звёздное небо • Levonze</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100vh;
      position: relative;
      color: white;
      font-family: sans-serif;
    }

    #info {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 18px;
      opacity: 0.7;
      pointer-events: none;
      z-index: 10;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration, 3s) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="info">Загрузка звёздного неба...</div>
  <div id="stars-container"></div>

  <script>
    const repo = "Levonze/levonze.github.io";

    async function fetchStarCount() {
      try {
        const response = await fetch(`https://api.github.com/repos/${repo}`);
        if (!response.ok) throw new Error("Репозиторий не найден");
        const data = await response.json();
        return data.stargazers_count;
      } catch (err) {
        console.error("Ошибка при загрузке данных:", err);
        return 0;
      }
    }

    function createStars(count) {
      const container = document.getElementById("stars-container");
      const info = document.getElementById("info");
      
      // Очистим контейнер на случай повторного вызова
      container.innerHTML = "";
      
      if (count === 0) {
        info.textContent = "Это небо пока пусто... Поставь звезду на GitHub!";
      } else {
        info.textContent = `Звёзд на небе: ${count} ⭐`;
      }

      // Ограничим для плавности (можно изменить)
      const maxStars = Math.min(count, 3000);

      for (let i = 0; i < maxStars; i++) {
        const star = document.createElement("div");
        star.classList.add("star");

        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const size = Math.random() * 2 + 0.5;
        const duration = Math.random() * 5 + 2;

        star.style.left = `${x}vw`;
        star.style.top = `${y}vh`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.setProperty("--duration", `${duration}s`);
        container.appendChild(star);
      }
    }

    fetchStarCount().then(createStars);
  </script>
</body>
</html>
