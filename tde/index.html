<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tiny Deception: Return</title>
        <link href="/main.css" rel="stylesheet">
        <link href="/tde/tde.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <div class="logo">Tiny Deception</div>
            </header>
        </div>

        <!-- Tiny Deception: Return -->
        <section id="tder" class="tder">
            <img src="/assets/project/tder/logo_tde.png" height="70">
            <img src="/assets/project/tder/logo_return.png" height="70">
            <hr style="width: 50%; margin: 1rem auto; border: none; height: 2px; background: linear-gradient(to right, #009, #909);">
            <p>Dark Deception and Minecraft fanmade.<br>Campaign, Multiplayer, Level Editor, Workshop</p>
            <a class="btn" href="https://levonze.itch.io/tder">Get dev-builds</a>
        </section>

        <!-- Tiny Deception: Last Slice -->
        <section id="tdels" class="tdels">
            <img src="/assets/project/tder/logo_tde.png" height="70">
            <img src="/assets/project/tder/logo_tls.png" height="70">
            <hr style="width: 50%; margin: 1rem auto; border: none; height: 2px; background: linear-gradient(to right, #900, #909);">
            <p>Chapter 5 Ending. Including last boss, animations, story.</p>
            <button class="tdels-btn">Will be available in Tiny Deception Collection</button>
        </section>

        <!-- Tiny Deception: Legacy -->
        <section id="tdel" class="tdel">
            <img src="/assets/project/tder/logo_tde.png" height="70">
            <img src="/assets/project/tder/logo_l.png" height="70">
            <hr style="width: 50%; margin: 1rem auto; border: none; height: 2px; background: linear-gradient(to right, #999, #fff);">
            <p>Chapter 5 Ending. Including last boss, animations, story.</p>
            <button class="tdel-btn">Will be available in Tiny Deception Collection</button>
        </section>

    </body>
</html>
